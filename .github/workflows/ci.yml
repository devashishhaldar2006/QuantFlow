name: QuantFlow CI/CD

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  validate-frontend:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./frontend
        run: npx prisma generate

      - name: Next.js Production Build Test
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=no-verify"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
          CLERK_SECRET_KEY: "sk_test_placeholder"
        run: npm run build

  validate-backend:
    name: Build & Test C++ Quant Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev libasio-dev libboost-all-dev libssl-dev

      - name: Configure CMake
        working-directory: ./backend
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile C++ Engine
        working-directory: ./backend
        run: cmake --build build --config Release -j$(nproc)

  deploy-backend-ec2:
    name: Build Docker Image & Deploy to AWS EC2
    needs: [validate-frontend, validate-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push C++ Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Deploy to AWS EC2 via SSH
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/quantflow
            cd ~/quantflow
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            docker stop quantflow-backend || true
            docker rm quantflow-backend || true
            docker run -d --restart always -p 8080:8080 --name quantflow-backend ghcr.io/${{ github.repository }}/backend:latest
            docker system prune -f

