services:
  # ── C++ Quant Engine REST API Server ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - quantflow-network

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: quantflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantflow_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: ${POSTGRES_DB:-quantflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantflow_app} -d ${POSTGRES_DB:-quantflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quantflow-network

  # ── Next.js Frontend Web Application ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - QUANT_ENGINE_URL=http://backend:8080
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quantflow_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quantflow}?schema=public
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/backend/data
    networks:
      - quantflow-network

volumes:
  postgres_data:
    driver: local

networks:
  quantflow-network:
    driver: bridge

