<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="qf_shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="qf_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="qf_flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Diamond Shield -->
  <rect x="5" y="5" width="38" height="38" rx="10" fill="#0B1120" stroke="url(#qf_shield)" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern Lines -->
  <line x1="5" y1="24" x2="43" y2="24" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="24" y1="5" x2="24" y2="43" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Stylized Geometric 'Q' & Quant Bars -->
  <path d="M14 26 L19 21 L24 25 L34 15" stroke="url(#qf_flow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="34" cy="15" r="2.5" fill="#38BDF8" />
  
  <!-- Bottom Bar Foundation -->
  <rect x="13" y="30" width="4" height="6" rx="1.5" fill="#3B82F6" opacity="0.8" />
  <rect x="20" y="27" width="4" height="9" rx="1.5" fill="#2563EB" opacity="0.9" />
  <rect x="27" y="23" width="4" height="13" rx="1.5" fill="#60A5FA" />
  <rect x="34" y="19" width="4" height="17" rx="1.5" fill="#93C5FD" />
</svg>
