<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Minimalist Geometric QuantFlow Logomark -->
  <!-- Outer subtle bounding square with hairline border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="#09090B" stroke="#18181B" stroke-width="1"/>
  
  <!-- Subtle coordinate crosshairs -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="#27272A" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="16" y1="6" x2="16" y2="26" stroke="#27272A" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Candlestick bar (Bearish/Correction) -->
  <line x1="10" y1="11" x2="10" y2="21" stroke="#71717A" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="8.5" y="13" width="3" height="5" rx="0.5" fill="#71717A" />

  <!-- Candlestick bar (Bullish breakout) -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="14.5" y="11" width="3" height="7" rx="0.5" fill="#FFFFFF" />

  <!-- Quant Vector Trend Line & Terminal Node -->
  <path d="M9 18 L15 13 L22 8" stroke="#10B981" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="8" r="1.75" fill="#10B981"/>
</svg>
